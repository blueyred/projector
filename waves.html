<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-Curve Waves</title>
<style>
body {
margin: 0;
overflow: hidden;
}
canvas {
display: block;
}
#keys{
    position: absolute;
    bottom: 0;
    right:0;
    padding: 5px 20px;
    background-color: white;
    color: black;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="keys" style="display:none">
    <p><b>F</b> fullscreen</p>
    <p><b>D</b> direction</p>
    <p><b>I</b> invert</p>

    <p><b>&larr;</b> <b>&rarr;</b> rotate</p>
    <p><b>Q</b> <b>W</b> Waves</p>
    <p><b>A</b> <b>S</b> Speed</p>
    <p><b>Z</b> <b>X</b> Thickness</p>
    
</div>
<script>
const keysEl = document.getElementById('keys');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

var white = 'hsl(0,0%,100%)';
var black = 'hsl(0,0%,0%)';

var backg = black;
var frontg = white;

var direction = -1;

let time = 0;
const waves = [];
let lineWidth;
let offset;
var heightMulti = 0.1;
const twoPI = 2 * Math.PI;
var canvasOverdraw = canvas.width * 0.1;
// Add rotation variable
let rotation = 0; 

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    lineWidth = (canvas.height * (0.03 + Math.random() * 0.02)) + 0.03; // 0.1 to 0.3 of screen height
    offset = canvas.height * heightMulti;
    canvasOverdraw = canvas.width * 0.1;
    initWaves();
}

function initWaves() {
    waves.length = 0; // Clear existing waves
    let numWaves = Math.ceil(canvas.height / offset) + 2;

    for (let i = 0; i < numWaves; i++) {
        waves.push({
            amplitude: lineWidth * 0.7,
            wavelength: canvas.width * (Math.random() * 0.5 + 0.5),
            speed: Math.random() * 0.06 + 0.02,
            phase: Math.random() * twoPI,
            //color: i % 2 === 0 ? 'hsl(170,100%,50%)' : 'hsl(10,100%,50%)',
//            color: frontg,
            yOffset: i * offset
        });
    }
}

function drawWave(wave) {
    ctx.beginPath();
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = frontg;//wave.color;

    // Save the current context state
    ctx.save(); 

    // Translate to the center of the canvas
    ctx.translate(canvas.width / 2, canvas.height / 2); 

    // Rotate the context
    ctx.rotate(rotation);

    // Translate back to the original position
    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    for (let x = -canvasOverdraw; x < canvas.width+canvasOverdraw; x = x+5) {
        //const y = wave.yOffset + wave.amplitude * Math.sin((x / wave.wavelength + time * wave.speed + wave.phase) * twoPI);
        const y = wave.yOffset + wave.amplitude * Math.sin((direction * x / wave.wavelength + time * wave.speed + wave.phase) * twoPI);
        ctx.lineTo(x, y);
    }

    ctx.stroke();

    // Restore the context to its original state
    ctx.restore();
}

function drawWaves() {

    ctx.fillStyle = backg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    waves.forEach(drawWave);    
}

function animate() {
    time += 0.1;
    drawWaves();
    requestAnimationFrame(animate);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
animate();

document.addEventListener(
  "keydown",
  (e) => {
    if (e.key === "f") {
      toggleFullScreen();
    }
    if(e.key === "a") {
        speedDown();
    }
    if(e.key === "s") {
        speedUp();
    }
    if(e.key === "z") {
        thinner();
    }
    if(e.key === "x") {
        thicker();
    }

    if(e.key === "q") {
        lessWaves();
    }
    if(e.key === "w") {
        moreWaves();
    }
    if(e.key === "d") {
        direction *= -1;
    }

    if(e.key === "i") {
        invert();
    }

    if (e.key === "k") {
        toggleKeys();
    }

    // Example: Rotate with arrow keys
    if (e.key === "ArrowLeft") {
      rotation -= 0.1;
    }
    if (e.key === "ArrowRight") {
      rotation += 0.1;
    }
  },
  false,
);

function moreWaves(){
    numWaves(0.05);
}

function lessWaves(){
    numWaves(-0.05);
}
function numWaves(multi){
    heightMulti += multi;
    if(heightMulti < 0.05){
        heightMulti = 0.05;
    }
    if(heightMulti > 0.9){
        heightMulti = 0.9;
    }
    resizeCanvas();

}
function thicker(){
    //lineWidth = Math.min(lineWidth * 1.2, canvas.height * 0.3);
    //offset = lineWidth;
    //initWaves();
    lineWidth *= 1.5;
}

function thinner(){
    lineWidth *= 0.8;
    //waves.forEach(wave => wave.speed *= 1.2);
    //lineWidth = Math.max(lineWidth * 0.8, canvas.height * 0.1);
    //offset = lineWidth;
    //initWaves();
}
function invert(){
    if(frontg == white){
        frontg = black;
        backg = white;
    }else{
        frontg = white;
        backg = black;
    }

}

function speedUp(){
    waves.forEach(wave => wave.speed *= 1.2);
}

function speedDown(){
    waves.forEach(wave => wave.speed *= 0.8);
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
}
function toggleKeys(){
    keysEl.style.display = keysEl.style.display === "none" ? "block" : "none";
}

</script>
</body>
</html>
